services:
  python:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: lotolab-python
    restart: unless-stopped
    env_file:
      - ./web/.env
    environment:
      - DB_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./python/lotofacil:/app/lotofacil
      - ./logs:/logs
      - ./data:/data
    ports:
      - "${PYTHON_PORT:-5001}:5000"
    networks:
      - lotolab_network

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lotolab-app
    restart: unless-stopped
    env_file:
      - ./web/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=host.docker.internal
      - PYTHON_API_URL=http://python:5000
    volumes:
      - ./web:/var/www/html
      - ./logs:/var/www/logs
      - ./data:/var/www/data
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./docker/php/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
    depends_on:
      - python
    networks:
      - lotolab_network

  nginx:
    image: nginx:alpine
    container_name: lotolab-nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    volumes:
      - ./web:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - lotolab_network

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lotolab-worker
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=300
    env_file:
      - ./web/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=host.docker.internal
      - PYTHON_API_URL=http://python:5000
    volumes:
      - ./web:/var/www/html
      - ./data:/var/www/data
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
    depends_on:
      - app
    networks:
      - lotolab_network

networks:
  lotolab_network:
    driver: bridge
